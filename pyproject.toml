[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow"
version = "0.1.0"
description = "An async project/task-management REST API with JWT auth, membership-based permissions, and background notifications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abdulmalek Azouz" }]
keywords = ["fastapi", "async", "rest-api", "sqlalchemy", "jwt"]

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.4,<3",
    "bcrypt>=4.1,<5",
    "PyJWT>=2.8,<3",
    "email-validator>=2.1,<3",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# B008 (function call in a default argument) is a false positive for
# FastAPI's Depends(...) pattern, which is the framework's intended,
# idiomatic way to declare a dependency.
ignore = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"
